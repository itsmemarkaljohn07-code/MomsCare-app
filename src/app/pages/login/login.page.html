<!-- login.page.html -->
<ion-content [fullscreen]="true" class="login-content">
  <div class="login-wrap">

    <!-- Gradient blobs -->
    <div class="blob blob-top"></div>
    <div class="blob blob-bottom"></div>

    <!-- Gradient hero area (replaces old icon + brand) -->
    <div class="hero-area" [class.visible]="animReady">
      <div class="back-btn" (click)="onBack()">
        <svg width="20" height="20" viewBox="0 0 20 20" fill="none" aria-hidden="true">
          <path d="M12.5 15L7.5 10L12.5 5" stroke="white" stroke-width="1.8"
                stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        <span>Back</span>
      </div>

      <div class="hero-text">
        <h1 class="hero-title">Welcome Back 👋</h1>
        <p class="hero-sub">Sign in to continue your journey</p>
      </div>
    </div>

    <!-- Login card anchored to bottom -->
    <div class="card" [class.visible]="animReady">
      <h2 class="card-title">Sign In</h2>
      <p class="card-sub">Enter your credentials below</p>

      <!-- Email -->
      <div class="field-group"
           [class.focused]="emailFocused"
           [class.has-value]="loginForm.email"
           [class.error]="touched.email && errors.email">
        <label class="field-label">Email</label>
        <div class="field-inner">
          <span class="field-icon">
            <svg width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true">
              <rect x="1.5" y="3" width="13" height="10" rx="2"
                    stroke="#b57fd4" stroke-width="1.4"/>
              <path d="M1.5 4.5L8 9L14.5 4.5"
                    stroke="#b57fd4" stroke-width="1.4" stroke-linecap="round"/>
            </svg>
          </span>
          <input
            class="field-input"
            type="email"
            autocomplete="email"
            [(ngModel)]="loginForm.email"
            (focus)="emailFocused = true"
            (blur)="emailFocused = false; validateEmail()"
            (ngModelChange)="touched.email && validateEmail()"
            placeholder="your@email.com"
          />
        </div>
        <div class="field-error-row" *ngIf="touched.email && errors.email">
          <svg width="12" height="12" viewBox="0 0 12 12" fill="none">
            <circle cx="6" cy="6" r="5.5" stroke="#e05580" stroke-width="1.2"/>
            <path d="M6 3.5v3" stroke="#e05580" stroke-width="1.4" stroke-linecap="round"/>
            <circle cx="6" cy="8.5" r=".6" fill="#e05580"/>
          </svg>
          <span>{{ errors.email }}</span>
        </div>
      </div>

      <!-- Password -->
      <div class="field-group"
           [class.focused]="passFocused"
           [class.has-value]="loginForm.password"
           [class.error]="touched.password && errors.password">
        <label class="field-label">Password</label>
        <div class="field-inner">
          <span class="field-icon">
            <svg width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true">
              <rect x="3" y="7" width="10" height="7.5" rx="1.5"
                    stroke="#b57fd4" stroke-width="1.4"/>
              <path d="M5.5 7V5a2.5 2.5 0 015 0v2"
                    stroke="#b57fd4" stroke-width="1.4" stroke-linecap="round"/>
              <circle cx="8" cy="10.5" r="1.1" fill="#b57fd4"/>
            </svg>
          </span>
          <input
            class="field-input"
            [type]="showPass ? 'text' : 'password'"
            autocomplete="current-password"
            [(ngModel)]="loginForm.password"
            (focus)="passFocused = true"
            (blur)="passFocused = false; validatePassword()"
            (ngModelChange)="touched.password && validatePassword()"
            placeholder="••••••••"
          />
          <button class="toggle-pass" (click)="showPass = !showPass" type="button"
                  [attr.aria-label]="showPass ? 'Hide password' : 'Show password'">
            <svg *ngIf="!showPass" width="16" height="16" viewBox="0 0 16 16" fill="none">
              <path d="M1.5 8C3 5.2 5.3 3.5 8 3.5S13 5.2 14.5 8C13 10.8 10.7 12.5 8 12.5S3 10.8 1.5 8Z"
                    stroke="#b57fd4" stroke-width="1.4"/>
              <circle cx="8" cy="8" r="2" stroke="#b57fd4" stroke-width="1.4"/>
            </svg>
            <svg *ngIf="showPass" width="16" height="16" viewBox="0 0 16 16" fill="none">
              <path d="M1.5 8C3 5.2 5.3 3.5 8 3.5S13 5.2 14.5 8C13 10.8 10.7 12.5 8 12.5S3 10.8 1.5 8Z"
                    stroke="#b57fd4" stroke-width="1.4"/>
              <circle cx="8" cy="8" r="2" stroke="#b57fd4" stroke-width="1.4"/>
              <line x1="3" y1="3" x2="13" y2="13" stroke="#b57fd4" stroke-width="1.4" stroke-linecap="round"/>
            </svg>
          </button>
        </div>
        <div class="field-error-row" *ngIf="touched.password && errors.password">
          <svg width="12" height="12" viewBox="0 0 12 12" fill="none">
            <circle cx="6" cy="6" r="5.5" stroke="#e05580" stroke-width="1.2"/>
            <path d="M6 3.5v3" stroke="#e05580" stroke-width="1.4" stroke-linecap="round"/>
            <circle cx="6" cy="8.5" r=".6" fill="#e05580"/>
          </svg>
          <span>{{ errors.password }}</span>
        </div>
      </div>

      <!-- Remember me + Forgot password -->
      <div class="options-row">
        <label class="remember-label">
          <input
            type="checkbox"
            class="remember-checkbox"
            [(ngModel)]="rememberMe"
          />
          <span class="remember-custom"></span>
          <span class="remember-text">Remember me</span>
        </label>
        <a class="forgot-link" (click)="onForgot()">Forgot password?</a>
      </div>

      <!-- Sign In button -->
      <button
        class="btn-signin"
        [class.loading]="isLoading"
        [disabled]="isLoading"
        (click)="onSignIn()"
      >
        <span class="btn-text" *ngIf="!isLoading">Sign In</span>
        <span class="btn-spinner" *ngIf="isLoading">
          <span></span><span></span><span></span>
        </span>
      </button>

      <!-- Divider -->
      <div class="divider"><span>or sign in with</span></div>

      <!-- Social login -->
      <div class="social-row">
        <button class="social-btn" (click)="onFacebook()">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="#1877F2">
            <path d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.47h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.47h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z"/>
          </svg>
          Facebook
        </button>
        <button class="social-btn" (click)="onGoogle()">
          <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
            <path d="M15.5 8.2c0-.6-.05-1.2-.16-1.7H8v3.2h4.2c-.18 1-.73 1.85-1.56 2.42v2h2.52c1.47-1.36 2.34-3.36 2.34-5.92Z" fill="#4285F4"/>
            <path d="M8 16c2.1 0 3.87-.7 5.16-1.88l-2.52-2c-.7.47-1.6.75-2.64.75-2.03 0-3.75-1.37-4.36-3.21H1.04v2.06C2.32 14.17 4.98 16 8 16Z" fill="#34A853"/>
            <path d="M3.64 9.66A4.85 4.85 0 013.38 8c0-.58.1-1.14.26-1.66V4.28H1.04A8 8 0 000 8c0 1.3.31 2.52.84 3.6l2.8-1.94Z" fill="#FBBC05"/>
            <path d="M8 3.18c1.14 0 2.17.39 2.98 1.16l2.23-2.23C11.86.8 10.1 0 8 0 4.98 0 2.32 1.83 1.04 4.28l2.8 1.94C4.26 4.55 5.97 3.18 8 3.18Z" fill="#EA4335"/>
          </svg>
          Google
        </button>
        <button class="social-btn" (click)="onApple()">
          <svg width="14" height="17" viewBox="0 0 14 17" fill="none">
            <path d="M11.8 9c0-2.4 2-3.6 2.1-3.7C12.5 3.4 11 3.2 10.4 3.2c-1.4-.1-2.7.8-3.4.8-.7 0-1.8-.8-3-.8C2.4 3.2.4 4.6.4 7.6c0 1.8.7 3.7 1.6 5 .8 1.1 1.5 2 2.6 2 1 0 1.4-.7 2.7-.7s1.7.7 2.7.7c1.1 0 1.8-1 2.5-2 .5-.6.8-1.3 1-2C10.1 9.7 11.8 7.6 11.8 9Z" fill="#3d2252"/>
            <path d="M9.5 1.5C9.6.4 8.7-.7 7.5-1c-.1 1.1.8 2.2 2 2.5Z" fill="#3d2252"/>
          </svg>
          Apple
        </button>
      </div>

      <!-- Register link -->
      <p class="register-row">
        New to MomsCare?
        <a class="register-link" (click)="onRegister()">Create account</a>
      </p>
    </div>

  </div>
</ion-content>
