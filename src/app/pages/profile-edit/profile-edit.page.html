<!-- profile-edit.page.html -->
<ion-content [fullscreen]="true" [attr.data-theme]="darkMode ? 'dark' : 'light'">
  <div class="page-wrap">
    <div class="blob blob-top"></div>
    <div class="blob blob-bottom"></div>

    <div class="page-header">
      <button class="back-btn" (click)="goBack()">
        <svg width="18" height="18" viewBox="0 0 18 18" fill="none">
          <path d="M11 4L6 9l5 5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
        </svg>
      </button>
      <div class="page-header-text">
        <h1 class="page-title">My Profile</h1>
        <p class="page-sub">Personal &amp; pregnancy information</p>
      </div>
      <button class="save-header-btn" (click)="saveProfile()" *ngIf="editMode">Save</button>
    </div>

    <div class="content-body" [class.visible]="animReady">

      <!-- Avatar -->
      <div class="avatar-section">
        <div class="avatar-circle" [style.background]="selectedAvatar.bgColor"
             (click)="navigate('/avatar')">
          <span class="avatar-emoji">{{ selectedAvatar.emoji }}</span>
          <div class="avatar-edit-dot">
            <svg width="10" height="10" viewBox="0 0 12 12" fill="none">
              <path d="M8.5 1.5l2 2-7 7H1.5v-2l7-7z" stroke="white" stroke-width="1.4"
                    stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </div>
        </div>
        <div class="avatar-name-area">
          <p class="avatar-display-name">{{ form.firstName }} {{ form.lastName }}</p>
          <p class="avatar-display-sub">{{ form.email }}</p>
        </div>
      </div>

      <!-- Edit toggle -->
      <div class="edit-toggle-row">
        <button class="edit-toggle-btn" (click)="editMode = !editMode">
          <svg width="14" height="14" viewBox="0 0 14 14" fill="none">
            <path d="M9.5 1.5l3 3-7.5 7.5H2v-3l7.5-7.5z" stroke="currentColor"
                  stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
          {{ editMode ? 'Cancel Editing' : 'Edit Profile' }}
        </button>
      </div>

      <!-- Personal Info -->
      <p class="section-label">Personal Information</p>
      <div class="card">
        <div class="field-row">
          <div class="field-group half">
            <label class="field-label">First Name</label>
            <input class="field-input" [(ngModel)]="form.firstName" [disabled]="!editMode" placeholder="First name"/>
          </div>
          <div class="field-group half">
            <label class="field-label">Last Name</label>
            <input class="field-input" [(ngModel)]="form.lastName" [disabled]="!editMode" placeholder="Last name"/>
          </div>
        </div>
        <div class="field-group">
          <label class="field-label">Email Address</label>
          <input class="field-input" type="email" [(ngModel)]="form.email" [disabled]="!editMode" placeholder="your@email.com"/>
        </div>
        <div class="field-group">
          <label class="field-label">Phone Number</label>
          <input class="field-input" type="tel" [(ngModel)]="form.phone" [disabled]="!editMode" placeholder="+63 900 000 0000"/>
        </div>
        <div class="field-group">
          <label class="field-label">Date of Birth</label>
          <input class="field-input" type="date" [(ngModel)]="form.dob" [disabled]="!editMode"/>
        </div>
        <div class="field-group">
          <label class="field-label">Address</label>
          <input class="field-input" [(ngModel)]="form.address" [disabled]="!editMode" placeholder="Home address"/>
        </div>
      </div>

      <!-- Pregnancy Info -->
      <p class="section-label">Pregnancy Information</p>
      <div class="card">
        <div class="field-group">
          <label class="field-label">Current Pregnancy Week</label>
          <input class="field-input" type="number" min="1" max="42" [(ngModel)]="form.pregnancyWeek" [disabled]="!editMode"/>
        </div>
        <div class="field-group">
          <label class="field-label">Expected Due Date</label>
          <input class="field-input" type="date" [(ngModel)]="form.dueDate" [disabled]="!editMode"/>
        </div>
        <div class="field-group">
          <label class="field-label">First-Time Mom?</label>
          <select class="field-select" [(ngModel)]="form.firstTimeMom" [disabled]="!editMode">
            <option value="yes">Yes, first pregnancy</option>
            <option value="no">No, I have children</option>
          </select>
        </div>
        <div class="field-group">
          <label class="field-label">Blood Type</label>
          <select class="field-select" [(ngModel)]="form.bloodType" [disabled]="!editMode">
            <option value="">Select blood type</option>
            <option *ngFor="let bt of bloodTypes" [value]="bt">{{ bt }}</option>
          </select>
        </div>
      </div>

      <!-- Medical Contact -->
      <p class="section-label">Healthcare Provider</p>
      <div class="card">
        <div class="field-group">
          <label class="field-label">OB-GYN / Midwife Name</label>
          <input class="field-input" [(ngModel)]="form.doctorName" [disabled]="!editMode" placeholder="Dr. Name"/>
        </div>
        <div class="field-group">
          <label class="field-label">Clinic / Hospital</label>
          <input class="field-input" [(ngModel)]="form.clinic" [disabled]="!editMode" placeholder="Clinic name"/>
        </div>
        <div class="field-group">
          <label class="field-label">Emergency Contact</label>
          <input class="field-input" [(ngModel)]="form.emergencyContact" [disabled]="!editMode" placeholder="Name · Relationship · Number"/>
        </div>
      </div>

      <div class="btn-wrap" *ngIf="editMode">
        <button class="btn-primary" (click)="saveProfile()">
          <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
            <path d="M3 8h10M9 4l4 4-4 4" stroke="white" stroke-width="1.8" stroke-linecap="round"/>
          </svg>
          Save Changes
        </button>
      </div>

      <!-- Save success toast -->
      <div class="toast" *ngIf="showToast">✓ Profile saved successfully</div>

    </div>
  </div>
</ion-content>
