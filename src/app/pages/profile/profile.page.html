<!-- profile.page.html -->
<ion-content [fullscreen]="true" class="profile-content" [attr.data-theme]="darkMode ? 'dark' : 'light'">

  <!-- Ambient blobs -->
  <div class="blob blob-top"></div>
  <div class="blob blob-bottom"></div>

  <div class="profile-page">

    <!-- ── Avatar & Name ── -->
    <div class="profile-header">
      <div class="profile-avatar-ring">
        <div class="profile-avatar-inner">
          <svg width="44" height="44" viewBox="0 0 44 44" fill="none">
            <circle cx="22" cy="17" r="8" stroke="#e07eb8" stroke-width="2" fill="none"/>
            <path d="M8 38c0-7.7 6.3-14 14-14s14 6.3 14 14" stroke="#e07eb8" stroke-width="2" stroke-linecap="round" fill="none"/>
          </svg>
        </div>
      </div>

      <h2 class="profile-name">Maria Santos</h2>
      <p class="profile-meta">Week {{ pregnancyWeek }} · {{ trimester }}</p>

      <div class="profile-badges">
        <span class="profile-badge">{{ babySize.emoji }} {{ babySize.fruit }}</span>
        <span class="profile-badge">{{ pregnancyProgress }}% complete</span>
      </div>
    </div>

    <!-- ── Appearance / Theme Toggle ── -->
    <div class="profile-section-label">Appearance</div>
    <div class="profile-theme-card">
      <div class="theme-row">
        <div class="theme-info">
          <div class="theme-label-icon-wrap">
            <svg *ngIf="!darkMode" width="20" height="20" viewBox="0 0 20 20" fill="none">
              <circle cx="10" cy="10" r="4" stroke="#e07eb8" stroke-width="1.6"/>
              <path d="M10 2v2M10 16v2M2 10h2M16 10h2M4.2 4.2l1.4 1.4M14.4 14.4l1.4 1.4M15.8 4.2l-1.4 1.4M5.6 14.4l-1.4 1.4" stroke="#e07eb8" stroke-width="1.5" stroke-linecap="round"/>
            </svg>
            <svg *ngIf="darkMode" width="20" height="20" viewBox="0 0 20 20" fill="none">
              <path d="M17 10.9A7 7 0 019.1 3a7 7 0 100 14A7 7 0 0017 10.9z" stroke="#c89fe0" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </div>
          <div>
            <p class="theme-label-text">{{ darkMode ? 'Dark Mode' : 'Light Mode' }}</p>
            <p class="theme-label-sub">{{ darkMode ? 'Easy on the eyes at night' : 'Bright and cheerful' }}</p>
          </div>
        </div>

        <button class="theme-toggle" (click)="toggleDarkMode()"
                [attr.aria-label]="darkMode ? 'Switch to light mode' : 'Switch to dark mode'">
          <div class="theme-toggle-track" [class.dark]="darkMode">
            <div class="theme-toggle-thumb">
              <svg *ngIf="!darkMode" width="12" height="12" viewBox="0 0 12 12" fill="none" class="toggle-svg">
                <circle cx="6" cy="6" r="2.5" stroke="currentColor" stroke-width="1.3"/>
                <path d="M6 1v1M6 10v1M1 6h1M10 6h1M2.5 2.5l.7.7M8.8 8.8l.7.7M9.5 2.5l-.7.7M3.2 8.8l-.7.7" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/>
              </svg>
              <svg *ngIf="darkMode" width="12" height="12" viewBox="0 0 12 12" fill="none" class="toggle-svg">
                <path d="M10 6.5A4.5 4.5 0 015.5 2a4.5 4.5 0 100 9A4.5 4.5 0 0010 6.5z" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/>
              </svg>
            </div>
          </div>
        </button>
      </div>
    </div>

    <!-- ── Settings List ── -->
    <div class="profile-section-label">Account &amp; Settings</div>
    <div class="settings-list">

      <!-- My Profile -->
      <button class="settings-item" (click)="navigate('/profile-edit')">
        <div class="settings-icon-wrap">
          <svg width="18" height="18" viewBox="0 0 18 18" fill="none">
            <circle cx="9" cy="6" r="3.5" stroke="#b57fd4" stroke-width="1.5"/>
            <path d="M3 16c0-3.3 2.7-6 6-6s6 2.7 6 6" stroke="#b57fd4" stroke-width="1.5" stroke-linecap="round"/>
          </svg>
        </div>
        <span class="settings-label">My Profile</span>
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none" class="settings-arrow">
          <path d="M6 4L10 8L6 12" stroke="#b57fd4" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </button>

      <!-- Pregnancy Settings -->
      <button class="settings-item" (click)="navigate('/pregnancy-settings')">
        <div class="settings-icon-wrap">
          <svg width="18" height="18" viewBox="0 0 18 18" fill="none">
            <ellipse cx="9" cy="11" rx="5" ry="6" stroke="#b57fd4" stroke-width="1.5"/>
            <circle cx="9" cy="6" r="2.5" stroke="#b57fd4" stroke-width="1.5"/>
          </svg>
        </div>
        <span class="settings-label">Pregnancy Settings</span>
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none" class="settings-arrow">
          <path d="M6 4L10 8L6 12" stroke="#b57fd4" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </button>

      <!-- Medical Records -->
      <button class="settings-item" (click)="navigate('/records')">
        <div class="settings-icon-wrap">
          <svg width="18" height="18" viewBox="0 0 18 18" fill="none">
            <rect x="3" y="2" width="12" height="14" rx="2" stroke="#b57fd4" stroke-width="1.5"/>
            <path d="M6 6h6M6 9h6M6 12h4" stroke="#b57fd4" stroke-width="1.3" stroke-linecap="round"/>
          </svg>
        </div>
        <span class="settings-label">Medical Records</span>
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none" class="settings-arrow">
          <path d="M6 4L10 8L6 12" stroke="#b57fd4" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </button>

      <!-- Baby Development -->
      <button class="settings-item" (click)="navigate('/development')">
        <div class="settings-icon-wrap">
          <svg width="18" height="18" viewBox="0 0 18 18" fill="none">
            <circle cx="9" cy="9" r="6" stroke="#b57fd4" stroke-width="1.5"/>
            <circle cx="9" cy="7" r="2" stroke="#b57fd4" stroke-width="1.3"/>
            <path d="M5 14c0-2.2 1.8-4 4-4s4 1.8 4 4" stroke="#b57fd4" stroke-width="1.3" stroke-linecap="round"/>
          </svg>
        </div>
        <span class="settings-label">Baby Development</span>
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none" class="settings-arrow">
          <path d="M6 4L10 8L6 12" stroke="#b57fd4" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </button>

      <!-- Appointments -->
      <button class="settings-item" (click)="navigate('/appointments')">
        <div class="settings-icon-wrap">
          <svg width="18" height="18" viewBox="0 0 18 18" fill="none">
            <rect x="2" y="3" width="14" height="13" rx="2" stroke="#b57fd4" stroke-width="1.5"/>
            <path d="M6 2v2M12 2v2M2 7h14" stroke="#b57fd4" stroke-width="1.4" stroke-linecap="round"/>
            <path d="M6 11h2M10 11h2M6 14h2" stroke="#b57fd4" stroke-width="1.3" stroke-linecap="round"/>
          </svg>
        </div>
        <span class="settings-label">Appointments</span>
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none" class="settings-arrow">
          <path d="M6 4L10 8L6 12" stroke="#b57fd4" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </button>

      <!-- App Settings -->
      <button class="settings-item" (click)="navigate('/settings')">
        <div class="settings-icon-wrap">
          <svg width="18" height="18" viewBox="0 0 18 18" fill="none">
            <circle cx="9" cy="9" r="2.5" stroke="#b57fd4" stroke-width="1.4"/>
            <path d="M9 2v1.5M9 14.5V16M2 9h1.5M14.5 9H16M3.8 3.8l1 1M13.2 13.2l1 1M14.2 3.8l-1 1M4.8 13.2l-1 1" stroke="#b57fd4" stroke-width="1.4" stroke-linecap="round"/>
          </svg>
        </div>
        <span class="settings-label">App Settings</span>
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none" class="settings-arrow">
          <path d="M6 4L10 8L6 12" stroke="#b57fd4" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </button>

      <!-- Reminders -->
      <button class="settings-item" (click)="navigate('/reminders')">
        <div class="settings-icon-wrap">
          <svg width="18" height="18" viewBox="0 0 18 18" fill="none">
            <path d="M9 2a5 5 0 00-5 5v2.5L2.5 12h13L14 9.5V7a5 5 0 00-5-5Z" stroke="#b57fd4" stroke-width="1.5"/>
            <path d="M7.5 14a1.5 1.5 0 003 0" stroke="#b57fd4" stroke-width="1.4" stroke-linecap="round"/>
          </svg>
        </div>
        <span class="settings-label">Reminders</span>
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none" class="settings-arrow">
          <path d="M6 4L10 8L6 12" stroke="#b57fd4" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </button>

      <!-- Graphs & Reports -->
      <button class="settings-item" (click)="navigate('/reports')">
        <div class="settings-icon-wrap">
          <svg width="18" height="18" viewBox="0 0 18 18" fill="none">
            <path d="M3 14V8M7 14V5M11 14V9M15 14V3" stroke="#b57fd4" stroke-width="1.5" stroke-linecap="round"/>
          </svg>
        </div>
        <span class="settings-label">Graphs &amp; Reports</span>
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none" class="settings-arrow">
          <path d="M6 4L10 8L6 12" stroke="#b57fd4" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </button>

      <!-- Claim Referral -->
      <button class="settings-item" (click)="navigate('/referral')">
        <div class="settings-icon-wrap">
          <svg width="18" height="18" viewBox="0 0 18 18" fill="none">
            <rect x="3" y="8" width="12" height="8" rx="1.5" stroke="#b57fd4" stroke-width="1.5"/>
            <path d="M9 8V5a3 3 0 00-3-3" stroke="#b57fd4" stroke-width="1.4" stroke-linecap="round"/>
            <path d="M9 8V5a3 3 0 013-3" stroke="#b57fd4" stroke-width="1.4" stroke-linecap="round"/>
            <path d="M9 8v6" stroke="#b57fd4" stroke-width="1.3" stroke-linecap="round"/>
            <path d="M3 11h12" stroke="#b57fd4" stroke-width="1.3" stroke-linecap="round"/>
          </svg>
        </div>
        <span class="settings-label">Claim Your Referral</span>
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none" class="settings-arrow">
          <path d="M6 4L10 8L6 12" stroke="#b57fd4" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </button>

      <!-- About -->
      <button class="settings-item" (click)="navigate('/about')">
        <div class="settings-icon-wrap">
          <svg width="18" height="18" viewBox="0 0 18 18" fill="none">
            <circle cx="9" cy="9" r="7" stroke="#b57fd4" stroke-width="1.5"/>
            <path d="M9 8v5" stroke="#b57fd4" stroke-width="1.5" stroke-linecap="round"/>
            <circle cx="9" cy="5.5" r=".8" fill="#b57fd4"/>
          </svg>
        </div>
        <span class="settings-label">About DailyMom</span>
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none" class="settings-arrow">
          <path d="M6 4L10 8L6 12" stroke="#b57fd4" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </button>

    </div>

    <!-- ── Sign Out ── -->
    <button class="signout-btn" (click)="navigate('/login')">
      <svg width="18" height="18" viewBox="0 0 18 18" fill="none">
        <path d="M7 3H4a1 1 0 00-1 1v10a1 1 0 001 1h3M11 13l4-4-4-4M15 9H7" stroke="#e05580" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      Sign Out
    </button>

    <div style="height: 32px;"></div>
  </div>

  <div class="bottom-nav">
    <button class="nav-item" (click)="navigate('/home', 'home')">
      <svg width="22" height="22" viewBox="0 0 22 22" fill="none">
        <path d="M3 9.5L11 3L19 9.5V19a1 1 0 01-1 1H4a1 1 0 01-1-1V9.5Z" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/>
        <path d="M8 20v-6h6v6" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      <span>Today</span>
    </button>

    <button class="nav-item" (click)="navigate('/home', 'tracker')">
      <svg width="22" height="22" viewBox="0 0 22 22" fill="none">
        <rect x="3" y="3" width="7" height="7" rx="2" stroke="currentColor" stroke-width="1.7"/>
        <rect x="12" y="3" width="7" height="7" rx="2" stroke="currentColor" stroke-width="1.7"/>
        <rect x="3" y="12" width="7" height="7" rx="2" stroke="currentColor" stroke-width="1.7"/>
        <rect x="12" y="12" width="7" height="7" rx="2" stroke="currentColor" stroke-width="1.7"/>
      </svg>
      <span>Insights</span>
    </button>

    <button class="nav-item" (click)="navigate('/home', 'appts')">
      <svg width="22" height="22" viewBox="0 0 22 22" fill="none">
        <path d="M8 9h6M8 13h4" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/>
        <rect x="3" y="4" width="16" height="15" rx="2" stroke="currentColor" stroke-width="1.7"/>
        <path d="M8 2v3M14 2v3" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/>
      </svg>
      <span>Appointments</span>
    </button>

    <button class="nav-item active" (click)="navigate('/profile')">
      <svg width="22" height="22" viewBox="0 0 22 22" fill="none">
        <circle cx="11" cy="8" r="4" stroke="currentColor" stroke-width="1.7"/>
        <path d="M4 19c0-3.9 3.1-7 7-7s7 3.1 7 7" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/>
      </svg>
      <span>Profile</span>
    </button>
  </div>

</ion-content>
